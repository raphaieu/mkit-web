name: Deploy mkit-web

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 77.37.68.36
          username: deploy
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ~/mkit-web

            echo "→ Pulling latest code..."
            git pull origin main

            echo "→ Installing dependencies..."
            npm ci

            echo "→ Building..."
            npm run build

            echo "→ Restarting PM2..."
            pm2 restart mkit_web

            echo "→ Saving PM2 process list..."
            pm2 save

            echo "✅ mkit-web deployed successfully!"