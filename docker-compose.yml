services:
  web:
    build:
      context: .
      target: production
      args:
        NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://api.mkit.com.br}
        NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-https://mkit.com.br}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_PUBLIC_API_BASE: ${NUXT_PUBLIC_API_BASE:-https://api.mkit.com.br}
      NUXT_PUBLIC_APP_URL: ${NUXT_PUBLIC_APP_URL:-https://mkit.com.br}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
